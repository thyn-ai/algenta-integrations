# Generated by litellm_algenta.config.build_mcp_server_entry -- see
# python/litellm-algenta/README.md for the full picture (auth types, profile enforcement,
# receipt passthrough, trace headers, token-expiry behavior).
#
# Self-hosted only: nothing below points at an Algenta-hosted endpoint. Set these in the
# environment the `litellm` proxy process runs in before starting it:
#   - ALGENTA_MCP_URL
#   - ALGENTA_OAUTH2_CLIENT_ID
#   - ALGENTA_OAUTH2_CLIENT_SECRET
#   - ALGENTA_OAUTH2_TOKEN_URL

mcp_servers:
  algenta:
    url: os.environ/ALGENTA_MCP_URL
    transport: http
    auth_type: oauth2
    oauth2_flow: client_credentials
    allowed_tools:
    - get_contract
    - query_data
    - recommend
    - simulate
    extra_headers:
    - x-trace-id
    token_url: os.environ/ALGENTA_OAUTH2_TOKEN_URL
    client_id: os.environ/ALGENTA_OAUTH2_CLIENT_ID
    client_secret: os.environ/ALGENTA_OAUTH2_CLIENT_SECRET
