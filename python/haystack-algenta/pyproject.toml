[project]
name = "haystack-algenta"
version = "0.1.3"
description = "Haystack tool integration for Algenta: a governed-execution-aware wrapper around Haystack's own MCPToolset, plus an Agent hook pair mapping the governed-execution receipt onto Haystack's real human-in-the-loop and hook primitives"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["algenta", "haystack", "deepset", "agent", "tools", "decision", "mcp", "agent-governance", "ai-agents", "llm", "guardrails", "audit-trail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# NOT `algenta-sdk`. This package never imports it: `create_algenta_tools` talks to the caller's
# self-hosted Algenta MCP endpoint directly via `haystack_integrations.tools.mcp.MCPToolset`, the
# same reason `maf-algenta` (D5) and `typescript/algenta-tools` (D2) have no `algenta-sdk`
# dependency either. Declaring it anyway -- without importing it anywhere in this package's own
# source -- would repeat the exact leftover-placeholder-dependency mistake an adversarial review
# is on record catching elsewhere in this repository's D2/D4 history (see this package's own
# README's "Why no `algenta-sdk` dependency" section).
#
# `mcp-haystack` (PyPI package name; import namespace `haystack_integrations.tools.mcp`) is a
# SEPARATE package from `haystack-ai` -- confirmed directly by grepping an installed `haystack-ai`
# 3.0.0 tree for any `mcp` module (none exists there). `MCPToolset`/`StreamableHttpServerInfo`
# live only in `mcp-haystack`, so this package depends on both `haystack-ai` (core `Tool`/
# `Toolset`/`Agent`/the human-in-the-loop hooks) and `mcp-haystack` (the real MCP client this
# package wraps) explicitly, rather than assuming the umbrella `haystack-ai` package covers MCP.
#
# `mcp` (the base Model Context Protocol SDK) is declared directly too: `mcp-haystack` depends on
# it transitively, but this package's own test suite builds a real `mcp.server.fastmcp.FastMCP`
# stub server, so it is a genuine (if test-oriented) part of this package's own dependency
# surface, not merely inherited.
#
# Every upper bound below is a real, currently-live, verified-live pin, not a defensive guess --
# each end of each range was actually installed and run against this package's own test suite
# (`uv run pytest haystack-algenta -v`, 59 passed both times):
#   * `haystack-ai` 3.0.0 (this repository's own CI-pinned floor) and 3.1.1 (the newest release
#     at time of writing) both pass.
#   * `mcp-haystack` 1.4.1 (CI-pinned floor) and 1.5.1 (newest) both pass.
#   * `mcp` 1.29.0 (CI-pinned floor) and 1.30.0 (newest 1.x) both pass -- but `mcp==2.0.0` (what
#     `pip install mcp` resolves to today with no upper bound at all) genuinely breaks this
#     package's own test suite: `mcp.server.fastmcp.FastMCP` was renamed to
#     `mcp.server.mcpserver.MCPServer` in that release, so `tests/stub_server.py`'s
#     `from mcp.server.fastmcp import FastMCP` raises `ModuleNotFoundError` before a single test
#     runs. `mcp<2.0.0` mirrors the same pin `llamaindex-algenta` already carries for its own,
#     differently-shaped `mcp` 2.x break -- an established, repository-wide convention, not an
#     invention for this package alone.
# Without these upper bounds, `pip install haystack-algenta` resolves whatever is newest on PyPI
# at install time -- silently drifting past the versions this package (or CI) has ever actually
# run against.
dependencies = [
    "haystack-ai>=3.0.0,<3.2.0",
    "mcp-haystack>=1.4.0,<1.6.0",
    "mcp>=1.29.0,<2.0.0",
]

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai"
Repository = "https://github.com/thyn-ai/algenta-integrations"

[project.optional-dependencies]
# `uvicorn` serves the test suite's stub Algenta MCP server (tests/stub_server.py -- a real
# `mcp.server.fastmcp.FastMCP` server, not a mock of anything in `haystack`'s internals) over a
# real local HTTP socket. Not needed by this package's own runtime code, which only ever acts as
# an MCP *client*.
dev = ["pytest", "pytest-cov", "uvicorn>=0.34"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["haystack_algenta*"]

[tool.coverage.run]
# The workspace runs one pytest process per package (see .github/workflows/ci.yml), so each
# run measures this package's own module only -- never the tests or sibling packages.
source = ["haystack_algenta"]

[tool.coverage.report]
# Gate for the CI python job (enforced via pytest-cov): measured at 96% on Python 3.12
# (2026-09-18), floored 2 points lower for headroom. Raise the floor as coverage grows.
fail_under = 94
show_missing = true
