[project]
name = "langchain-algenta"
version = "0.1.3"
description = "LangChain / LangGraph tool integration for Algenta: a governed-execution-aware toolset wrapping a self-hosted Algenta engine's MCP tool surface"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["algenta", "langchain", "langgraph", "agent", "tools", "decision", "mcp", "agent-governance", "ai-agents", "llm", "guardrails", "audit-trail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The ONLY Algenta dependency any package in this repo may declare. See
# scripts/check-no-engine-dependency.py, which enforces this on every PR. `langchain-core` and
# `langchain-mcp-adapters` are the other real, runtime dependencies this integration needs --
# not dev-only, since `create_algenta_tools` builds a real
# `langchain_mcp_adapters.client.MultiServerMCPClient`. `langgraph` is deliberately NOT a runtime
# dependency: an earlier version of this package called `langgraph.types.interrupt(...)`
# unconditionally to pause on a fictional "pending approval" receipt shape the real engine never
# actually returns (see `langchain_algenta.governance`'s module docstring and the package
# README); once that pause was removed as dead/fictional code, nothing in this package's own
# source imports `langgraph` anymore. The tools this package returns are still ordinary LangChain
# `BaseTool`s, fully usable inside a `langgraph` agent -- that's just your own dependency to add,
# not this package's. Version floors below are the exact versions verified against this
# package's real, current APIs while building it (see the research notes referenced in this
# package's PR): langchain-core 1.6.0, langchain-mcp-adapters 0.3.2.
dependencies = [
    "algenta-sdk>=1.0.23",
    "langchain-core>=1.6.0",
    "langchain-mcp-adapters>=0.3.2",
]

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai"
Repository = "https://github.com/thyn-ai/algenta-integrations"

[project.optional-dependencies]
# `mcp` (the base Model Context Protocol SDK) is already a transitive dependency of
# `langchain-mcp-adapters`, but is listed explicitly here since the test suite's stub Algenta
# MCP server (tests/stub_server.py) imports `mcp.server.fastmcp.FastMCP` directly -- a real MCP
# server, not a mock of `AlgentaToolCallInterceptor`'s internals. `httpx` is likewise already
# transitive (via `mcp`) but is listed explicitly since a test constructs an `httpx.Auth` value.
dev = ["pytest", "pytest-asyncio", "pytest-cov", "mcp>=1.29.0", "httpx>=0.27"]
# The full `langchain` metapackage is deliberately NOT a runtime dependency of this package --
# see the "Install" section of the README for why (`create_algenta_tools` only ever needs the
# lightweight `langchain-core`, already declared above). The README's own Quick start builds its
# agent with `langchain.agents.create_agent`, which does need the full package; `pip install
# langchain-algenta[quickstart]` is a convenience for readers following that example, not a
# requirement for using `create_algenta_tools` itself. Floor verified against this package's real
# APIs while fixing this: `langchain` 1.4.0 (which pulls in `langgraph` 1.2.11 transitively --
# via `langchain` itself, not via anything this package's own source imports; see "Why no
# `langgraph` dependency" in the README).
quickstart = ["langchain>=1.4.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["langchain_algenta*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
# The workspace runs one pytest process per package (see .github/workflows/ci.yml), so each
# run measures this package's own module only -- never the tests or sibling packages.
source = ["langchain_algenta"]

[tool.coverage.report]
# Gate for the CI python job (enforced via pytest-cov): measured at 92% on Python 3.12
# (2026-09-18), floored 2 points lower for headroom. Raise the floor as coverage grows.
fail_under = 90
show_missing = true
