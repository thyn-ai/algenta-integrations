[project]
name = "support-triage"
version = "0.1.0"
description = "Governed support-triage example app on LangGraph: observe, govern, approve, execute, persist."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# This example app is not published; it demonstrates the langchain-algenta building block
# end-to-end with a real LangGraph orchestration layer and a human-in-the-loop approval gate.
dependencies = [
    "algenta-sdk>=1.0.37",
    "langchain-algenta",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "mcp>=1.29.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["support_triage*"]

[tool.uv.sources]
langchain-algenta = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
