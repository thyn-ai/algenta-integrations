[project]
name = "maf-algenta"
version = "0.1.3"
description = "Microsoft Agent Framework (MAF) tool integration for Algenta: a governed-execution-aware FunctionTool list wrapping a self-hosted Algenta engine's MCP tool surface"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["algenta", "agent-framework", "maf", "agent", "tools", "decision", "mcp", "agent-governance", "ai-agents", "llm", "guardrails", "audit-trail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# NOT `algenta-sdk`. This package never imports it: `create_algenta_tools` talks to the caller's
# self-hosted Algenta MCP endpoint directly via `agent_framework.MCPStreamableHTTPTool`, the same
# reason `typescript/algenta-tools` has no `algenta-sdk` dependency either (see the root
# README's "Every package may depend on at most one Algenta-owned thing" paragraph) -- declaring
# it anyway would repeat a leftover-placeholder-dependency mistake already caught and fixed
# elsewhere in this repository; see this package's own README for the full note.
#
# `agent-framework-core` (real PyPI package, 1.15.0 confirmed installed and exercised while
# building this package), not the `agent-framework` umbrella package -- verified directly against
# PyPI metadata that `agent-framework==1.15.0`'s *only* dependency is `agent-framework-core[all]`,
# whose `[all]` extra unconditionally drags in the Foundry-hosting bridge
# (`agent-framework-foundry-hosting`) and pre-release `azure-ai-agentserver-*` packages this
# package has no use for and does not want on its dependency graph -- this package covers MAF
# running standalone, with no Azure or Foundry adapters involved; see `foundry/README.md` for the
# separate, documentation-only Foundry integration notes. `agent-framework-core` with no extras
# provides every symbol this package actually
# imports (`MCPStreamableHTTPTool`, `FunctionTool`, `MiddlewareFailure`, `Agent`, ...) -- verified
# directly: `pip install agent-framework-core` alone (no `mcp` extra either -- see below) resolves
# cleanly with only ordinary, non-pre-release dependencies.
#
# `mcp` (the base Model Context Protocol SDK) is a real, non-optional runtime dependency here,
# not just a test dependency: `agent-framework-core` does not declare `mcp` as one of its own
# dependencies at all (confirmed directly against its installed metadata) -- it imports `mcp`
# lazily, only when an `MCPTool` subclass actually connects. Since `create_algenta_tools`'s
# primary code path always builds and connects one, this package must declare `mcp` itself or
# risk an `ImportError` at the caller's runtime that this package's own `pyproject.toml` should
# have prevented.
#
# Capped at `<2`: `mcp` 2.x renamed its `mcp.server.fastmcp.FastMCP` server class to
# `mcp.server.mcpserver.MCPServer` (confirmed directly against the installed 2.2.0 package's own
# `ModuleNotFoundError` message, which names the rename and its migration guide), which
# `tests/stub_server.py`'s local, offline stand-in for a self-hosted Algenta MCP endpoint is built
# on -- so `mcp` 2.x breaks this package's own test suite and its README's "Try it locally"
# example on a fresh install today. This isn't an arbitrary choice: `agent-framework-core`'s own
# `[all]` extra caps its own optional `mcp` dependency at exactly `mcp>=1.24.0,<2` for the same
# reason (confirmed directly against its installed metadata) -- this package's ceiling matches the
# one its own upstream MCP dependency has already verified.
#
# `httpx` is a real, non-optional runtime dependency for the same reason, verified live from a
# from-scratch `pip install maf-algenta`: `agent_framework._mcp`'s `MCPStreamableHTTPTool.connect()`
# -- the exact call `create_algenta_tools`'s primary code path always makes -- imports `httpx`
# directly, and neither `agent-framework-core` nor `mcp` installs it as of their currently
# published releases (`mcp`'s own dependency moved to `httpx2`, a separate, newer package from the
# same author, not a version of `httpx` itself). Without this line, `pip install maf-algenta`
# resolves cleanly and only fails once a caller actually tries to connect, with a confusing
# `ModuleNotFoundError: No module named 'httpx'` this package's own `pyproject.toml` should have
# prevented -- see the README's "Why `httpx`" section.
dependencies = [
    "agent-framework-core>=1.18.0",
    "mcp>=1.30.0,<2",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai"
Repository = "https://github.com/thyn-ai/algenta-integrations"

[project.optional-dependencies]
# `uvicorn` serves the test suite's stub Algenta MCP server (tests/stub_server.py -- a real
# `mcp.server.fastmcp.FastMCP` server, not a mock of anything in `agent_framework`'s internals)
# over a real local HTTP socket. Not needed by this package's own runtime code, which only ever
# acts as an MCP *client* (`mcp` itself is a main dependency, see above, precisely because the
# client role is not test-only).
dev = ["pytest", "pytest-asyncio", "pytest-cov", "uvicorn>=0.52.4"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maf_algenta*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
# The workspace runs one pytest process per package (see .github/workflows/ci.yml), so each
# run measures this package's own module only -- never the tests or sibling packages.
source = ["maf_algenta"]

[tool.coverage.report]
# Gate for the CI python job (enforced via pytest-cov): measured at 93% on Python 3.12
# (2026-09-18), floored 2 points lower for headroom. Raise the floor as coverage grows.
fail_under = 91
show_missing = true
