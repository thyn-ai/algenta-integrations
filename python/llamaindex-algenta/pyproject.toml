[project]
name = "llamaindex-algenta"
version = "0.2.4"
description = "LlamaIndex tool integration for Algenta: a governed-execution-aware FunctionTool list wrapping a self-hosted Algenta Engine's MCP tool surface"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["algenta", "llama-index", "llamaindex", "agent", "tools", "decision", "mcp", "agent-governance", "ai-agents", "llm", "guardrails", "audit-trail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# NOT `algenta-sdk`. This package never imports it: `create_algenta_tools` talks to the
# caller's own self-hosted Algenta MCP endpoint directly via `llama_index.tools.mcp`'s own
# `BasicMCPClient` -- the same reason `maf-algenta` (D5) and `typescript/algenta-tools` (D2)
# have no `algenta-sdk` dependency either (see the root README's "Every package may depend on
# at most one Algenta-owned thing" paragraph). Declaring it anyway would be exactly the
# leftover-placeholder-dependency mistake an adversarial review caught on this repository's
# other packages.
#
# `llama-index-tools-mcp`, NOT the `llama-index` umbrella metapackage: verified directly
# against its installed `.dist-info/METADATA` that its own `Requires-Dist` is only
# `llama-index-core` + `mcp` + `pydantic` -- `pip install llama-index-core llama-index-tools-mcp`
# never pulls in every model-provider SDK the full `llama-index` metapackage depends on, the
# same "only the surface this package actually needs" reasoning `pydantic-ai-slim[mcp]` (D1)
# and `agent-framework-core` (D5) already document for their own frameworks.
#
# `mcp<2.0.0` is a real, currently-live, verified-live pin, not a defensive guess: with
# `mcp==2.0.0` (the version that `pip install llama-index-core llama-index-tools-mcp` resolves
# to today, since `llama-index-tools-mcp` 0.5.0's own `Requires-Dist` is `mcp<3,>=2.0.0`), every
# `BasicMCPClient` HTTP call throws `ValueError: not enough values to unpack (expected 3, got 2)`
# from `llama_index/tools/mcp/client.py`'s `_run_session` -- that code still unpacks
# `mcp.client.streamable_http.streamable_http_client(...)`'s yield as a 3-tuple
# `(read, write, _)`, but installed `mcp==2.0.0`'s `streamable_http_client` now yields a 2-tuple.
# Pinning `mcp<2.0.0` here (mirroring what `llama-index-tools-mcp` 0.4.8 itself required before
# 0.5.0 bumped its own `mcp` floor) makes the dependency resolver pick `llama-index-tools-mcp`
# 0.4.8 instead, whose HTTP transport is verified working end-to-end against a real server. A
# stdio transport also works around this on 0.5.0/mcp==2.0.0 (splat-unpacked, not fixed-arity),
# but self-hosted Algenta engines are reached over HTTP in every sibling package's design, so
# pinning `mcp<2.0.0` is the realistic fix here, not "use stdio instead."
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "llama-index-tools-mcp>=0.4.0,<0.7",
    "mcp<2.0.0",
]

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai"
Repository = "https://github.com/thyn-ai/algenta-integrations"

[project.optional-dependencies]
# `fastmcp` (full, not just the client-only surface `llama-index-tools-mcp` already needs) is a
# test-only dependency: the test suite's stub Algenta MCP server (tests/stub_server.py) is a
# real `fastmcp.FastMCP` *server*, which needs fastmcp's server-side support. Never imported by
# any non-test module in this package. Verified installable and working alongside the `mcp<2.0.0`
# pin above with fastmcp 3.x (mcp 1.29.0/1.30.0 satisfy both). The `<4` upper bound is required,
# not defensive: fastmcp 4.0.0 switched its own "server"/"client" extras to require `mcp<3,>=2.0.0`,
# which directly conflicts with this package's own `mcp<2.0.0` pin above -- `pip install
# ".[dev]"` only resolves today because pip's resolver silently backtracks two major fastmcp
# versions to find 3.x; a stricter resolver, or a private index that doesn't mirror older
# releases, has nothing to backtrack to and fails outright. Pinning `<4` makes that resolution
# explicit instead of relying on invisible backtracking.
dev = ["pytest", "pytest-asyncio", "pytest-cov", "fastmcp>=3,<4"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llamaindex_algenta*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
# The workspace runs one pytest process per package (see .github/workflows/ci.yml), so each
# run measures this package's own module only -- never the tests or sibling packages.
source = ["llamaindex_algenta"]

[tool.coverage.report]
# Gate for the CI python job (enforced via pytest-cov): measured at 90% on Python 3.12
# (2026-09-18), floored 2 points lower for headroom. Raise the floor as coverage grows.
fail_under = 88
show_missing = true
