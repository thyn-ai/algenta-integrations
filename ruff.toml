# Repository-wide Ruff configuration (python/, scripts/, demo/). Enforced by pre-commit
# locally and by the `ruff` job in .github/workflows/ci.yml on every PR -- both run the
# same ruff release (see the job's install pin), so local and CI verdicts agree.
line-length = 100
target-version = "py310"
extend-exclude = ["**/.venv", "**/build", "**/dist", "**/node_modules"]

[lint]
select = ["E", "W", "F", "I", "B", "UP"]
# Long lines are the formatter's job where it can wrap them; the remaining ones
# (URLs, long strings) are not worth blocking a commit over.
ignore = ["E501"]
