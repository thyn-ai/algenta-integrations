# Tier-1, untrusted CI. Runs on every PR, including ones from forks (once this
# repo is public — see the visibility note below). No secrets are referenced
# anywhere in this file, on purpose.
#
# NOTE for whoever flips this repo's visibility to public: self-hosted fleet
# runners (used below via vars.RUNNER_LABELS, since GitHub-hosted runners are
# billing-blocked for this org) do not run jobs triggered by fork PRs on
# PUBLIC repositories — the org's runner group has allows_public_repositories
# set to false. That is a deliberate org-wide security posture, not a bug in
# this file, and the established fix elsewhere in the org is to move
# fork-triggered logic into a webhook-driven check rather than Actions. Do
# not "fix" this by changing runner-group visibility as a side effect of an
# unrelated PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The one check this entire repository exists to enforce. See
  # scripts/check-no-engine-dependency.py's module docstring and
  # scripts/test_check_no_engine_dependency.py for the proof it actually
  # catches a violation (not just a script nobody exercised).
  no-engine-dependency:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Discovered, never hardcoded -- the old tool-cache path pinned a version, an arch and a
      # layout, and all three broke when the fleet moved off macOS. See the action for detail.
      - name: Fleet Python (discovered, into a venv)
        uses: ./.github/actions/fleet-python
      - name: Run the checker against this repository
        run: python scripts/check-no-engine-dependency.py --root .
      - name: Run the checker's own regression tests (proves it catches violations)
        run: python scripts/test_check_no_engine_dependency.py

  # Regression tests for the zero-PR release automation (see .github/workflows/auto-release.yml
  # and scripts/compute_release_bumps.py). Only exercises the script directly against throwaway
  # temp git repos -- never touches this repository's own history or main.
  release-automation:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Discovered, never hardcoded -- the old tool-cache path pinned a version, an arch and a
      # layout, and all three broke when the fleet moved off macOS. See the action for detail.
      - name: Fleet Python (discovered, into a venv)
        uses: ./.github/actions/fleet-python
      - name: Run compute_release_bumps.py's regression tests
        run: python scripts/test_compute_release_bumps.py

  python:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Discovered, never hardcoded -- the old tool-cache path pinned a version, an arch and a
      # layout, and all three broke when the fleet moved off macOS. See the action for detail.
      - name: Fleet Python (discovered, into a venv)
        uses: ./.github/actions/fleet-python
      - name: Install uv
        run: python -m pip install --quiet --disable-pip-version-check uv
      # --all-extras is required, not cosmetic: pytest/pytest-asyncio/anyio only live under each
      # package's `dev` optional-dependencies extra (never a hard dependency of the published
      # package). Without it, `.venv/bin/pytest` never gets created, so `uv run pytest` silently
      # falls back to whatever global `pytest` happens to be on PATH (here, the fleet's
      # pre-provisioned Python 3.14 tool cache) -- a completely different interpreter that can't
      # see anything installed in this project's `.venv`. That produced a real, CI-reproduced
      # `ModuleNotFoundError: No module named 'pydantic_ai'` despite pydantic-ai-slim being
      # correctly listed and installed as pydantic-ai-algenta's dependency; the module was never
      # missing, `uv run pytest` was just running under the wrong Python entirely.
      - name: Sync the workspace (installs the REAL published algenta-sdk from PyPI)
        working-directory: python
        run: uv sync --all-packages --all-extras
      - name: Validate the shared tool-profile contract (stub today, see script header)
        # Stdlib-only script -- no venv needed, but PATH already has fleet
        # Python from the step above.
        run: python scripts/check-parity.py
      # ONE pytest PROCESS PER PACKAGE -- deliberately not a single invocation over several
      # package dirs. Every package's suite is laid out as `<pkg>/tests/` with a `tests/__init__.py`
      # (load-bearing: the suites use relative imports like `from .stub_server import ...`), so in
      # one shared pytest run two packages both resolve to the module name `tests.conftest` and
      # collection dies with `ImportPathMismatchError` before a single test executes. That is a
      # real, CI-reproduced failure, not a theoretical one, and it gets worse with each package:
      # pydantic-ai-algenta and langchain-algenta already share NINE identical test filenames
      # (conftest.py, helpers.py, stub_server.py and six test_*.py).
      #
      # Rejected alternatives, each actually tried and observed to fail:
      #   * `--import-mode=importlib` alone -> still `tests.conftest` for both (pytest derives the
      #     name by walking up `__init__.py` files), dies with "Plugin already registered under a
      #     different name".
      #   * dropping `tests/__init__.py` (with or without importlib) -> breaks the suites' own
      #     relative imports: "attempted relative import with no known parent package".
      # Separate processes give each package its own interpreter and module namespace, which is
      # also what an independently-releasable package should be tested under anyway.
      #
      # Package list is DISCOVERED, not hardcoded, so a newly-implemented package is picked up
      # without touching this workflow. pytest exits 5 (not 0) when a package collects zero tests
      # -- true for any still-scaffolded package -- so tolerate exactly 5 per package; any other
      # nonzero exit (a real failure or a collection error) fails the build, and the first such
      # code is preserved rather than masked by a later passing package.
      - name: Run package tests (one pytest process per package)
        working-directory: python
        run: |
          set -euo pipefail
          overall=0
          found=0
          for pkg in */; do
            pkg="${pkg%/}"
            [ -f "$pkg/pyproject.toml" ] || continue
            found=$((found + 1))
            echo "::group::pytest $pkg"
            set +e
            uv run pytest "$pkg" -v
            code=$?
            set -e
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "$pkg: passed"
            elif [ "$code" -eq 5 ]; then
              echo "$pkg: no tests collected yet (scaffolded) -- tolerated"
            else
              echo "$pkg: FAILED with exit code $code"
              [ "$overall" -eq 0 ] && overall=$code
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No python packages discovered under python/ -- the discovery glob is wrong."
            exit 1
          fi
          echo "Ran $found package(s)."
          exit "$overall"

  typescript:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          # setup-node's cache:npm tars up the runner's entire global npm cache
          # dir every run. On a persistent self-hosted runner that cache never
          # resets across jobs/repos, so it balloons unbounded -- same fix as
          # sibling repos' ci.yml.
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Matches the "packageManager" pin in typescript/algenta-tools/package.json.
          version: 9
      - name: Install (installs the REAL published algenta-sdk from npm)
        working-directory: typescript/algenta-tools
        run: pnpm install --frozen-lockfile
      - name: Build + lint + test every TS package (turbo)
        working-directory: typescript/algenta-tools
        run: pnpm turbo run build lint test
      - name: Validate the shared tool-profile contract (stub today, see script header)
        run: npx --yes tsx@4 scripts/check-parity.ts

  # contracts/integration-tool-contract.json's own JSON-syntax validity is
  # covered as a side effect of both check-parity.py and check-parity.ts
  # (both refuse to run on a malformed contract file) -- no separate job
  # needed for that alone.
