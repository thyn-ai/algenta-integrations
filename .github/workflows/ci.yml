# Tier-1, untrusted CI. Runs on every PR, including ones from forks. No secrets are
# referenced anywhere in this file, on purpose.
#
# Every job runs on standard GitHub-hosted runners: free for public repositories, and
# they run fork-triggered jobs the day this repository flips to public.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The one check this entire repository exists to enforce. See
  # scripts/check-no-engine-dependency.py's module docstring and
  # scripts/test_check_no_engine_dependency.py for the proof it actually
  # catches a violation (not just a script nobody exercised).
  no-engine-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checker and its regression tests are stdlib-only scripts -- a vanilla,
      # pinned interpreter is all they need.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the checker against this repository
        run: python scripts/check-no-engine-dependency.py --root .
      - name: Run the checker's own regression tests (proves it catches violations)
        run: python scripts/test_check_no_engine_dependency.py

  # Regression tests for the zero-PR release automation (see .github/workflows/auto-release.yml
  # and scripts/compute_release_bumps.py). Only exercises the script directly against throwaway
  # temp git repos -- never touches this repository's own history or main.
  release-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release scripts and their regression tests are stdlib-only -- a vanilla,
      # pinned interpreter is all they need.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run compute_release_bumps.py's regression tests
        run: python scripts/test_compute_release_bumps.py
      - name: Run resolve_release_target.py's regression tests
        # The tag -> package resolver publish.yml depends on. It must agree with
        # compute_release_bumps.py on the tag format, and only that script writes tags.
        run: python scripts/test_resolve_release_target.py

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload
    timeout-minutes: 20
    env:
      # Pin uv to the interpreter actions/setup-python just provisioned. Without this uv
      # prefers its own "managed" CPython and silently downloads a second, floating
      # interpreter -- the setup step would be decoration and the toolchain unpinned.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        # Hash-pinned: pip refuses any wheel/sdist whose hash is not in
        # .github/requirements/uv.txt (see the .in file there for how to bump).
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r .github/requirements/uv.txt
      # --all-extras is required, not cosmetic: pytest/pytest-asyncio/pytest-cov/anyio only
      # live under each package's `dev` optional-dependencies extra (never a hard dependency
      # of the published package). Without it, `.venv/bin/pytest` never gets created, so
      # `uv run pytest` silently falls back to whatever global `pytest` happens to be on
      # PATH -- a completely different interpreter that can't see anything installed in this
      # project's `.venv`. That produced a real, CI-reproduced
      # `ModuleNotFoundError: No module named 'pydantic_ai'` despite pydantic-ai-slim being
      # correctly listed and installed as pydantic-ai-algenta's dependency; the module was never
      # missing, `uv run pytest` was just running under the wrong Python entirely.
      - name: Sync the workspace (installs the REAL published algenta-sdk from PyPI)
        working-directory: python
        run: uv sync --all-packages --all-extras
      - name: Validate the shared tool-profile contract (stub today, see script header)
        # Stdlib-only script -- no venv needed; PATH already has the pinned
        # interpreter from the step above.
        run: python scripts/check-parity.py
      # ONE pytest PROCESS PER PACKAGE -- deliberately not a single invocation over several
      # package dirs. Every package's suite is laid out as `<pkg>/tests/` with a `tests/__init__.py`
      # (load-bearing: the suites use relative imports like `from .stub_server import ...`), so in
      # one shared pytest run two packages both resolve to the module name `tests.conftest` and
      # collection dies with `ImportPathMismatchError` before a single test executes. That is a
      # real, CI-reproduced failure, not a theoretical one, and it gets worse with each package:
      # pydantic-ai-algenta and langchain-algenta already share NINE identical test filenames
      # (conftest.py, helpers.py, stub_server.py and six test_*.py).
      #
      # Rejected alternatives, each actually tried and observed to fail:
      #   * `--import-mode=importlib` alone -> still `tests.conftest` for both (pytest derives the
      #     name by walking up `__init__.py` files), dies with "Plugin already registered under a
      #     different name".
      #   * dropping `tests/__init__.py` (with or without importlib) -> breaks the suites' own
      #     relative imports: "attempted relative import with no known parent package".
      # Separate processes give each package its own interpreter and module namespace, which is
      # also what an independently-releasable package should be tested under anyway.
      #
      # Package list is DISCOVERED, not hardcoded, so a newly-implemented package is picked up
      # without touching this workflow. pytest exits 5 (not 0) when a package collects zero tests
      # -- true for any still-scaffolded package -- so tolerate exactly 5 per package; any other
      # nonzero exit (a real failure or a collection error) fails the build, and the first such
      # code is preserved rather than masked by a later passing package.
      #
      # Packages WITH a tests/ directory additionally run under coverage. `--cov` takes its
      # measure-what (this package's own module), the fail-under floor, and show-missing from
      # the package's own pyproject.toml `[tool.coverage.*]` sections -- passed explicitly via
      # --cov-config because coverage.py discovers config from the CWD (the workspace root),
      # not from pytest's rootdir. The per-package floor is what FAILS the run below (pytest
      # exits 1); the XML is only the Codecov input.
      - name: Run package tests (one pytest process per package)
        working-directory: python
        run: |
          set -euo pipefail
          overall=0
          found=0
          for pkg in */; do
            pkg="${pkg%/}"
            [ -f "$pkg/pyproject.toml" ] || continue
            found=$((found + 1))
            echo "::group::pytest $pkg"
            set +e
            if [ -d "$pkg/tests" ]; then
              uv run pytest "$pkg" -v --cov \
                --cov-config="$pkg/pyproject.toml" \
                --cov-report term \
                --cov-report "xml:$pkg/coverage.xml"
            else
              # Scaffolded package with no suite yet: nothing to measure, and --cov
              # would fail the run on 0% of nothing.
              uv run pytest "$pkg" -v
            fi
            code=$?
            set -e
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "$pkg: passed"
            elif [ "$code" -eq 5 ]; then
              echo "$pkg: no tests collected yet (scaffolded) -- tolerated"
            else
              echo "$pkg: FAILED with exit code $code"
              [ "$overall" -eq 0 ] && overall=$code
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No python packages discovered under python/ -- the discovery glob is wrong."
            exit 1
          fi
          echo "Ran $found package(s)."
          exit "$overall"
      # Tokenless upload: Codecov accepts uploads without a token from GitHub Actions on
      # PUBLIC repositories, so no secret is needed here once the repo flips. While the repo
      # is still private the upload is rejected -- hence fail_ci_if_error: false (and the
      # same on the TypeScript upload below). Coverage ENFORCEMENT is the per-package
      # fail_under gate above; Codecov is only the dashboard, so an upload outage must never
      # take CI down.
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true  # GitHub OIDC instead of a Codecov token (the job grants id-token write)
          directory: python
          flags: python
          fail_ci_if_error: false

  typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          # No global npm cache: the workspaces are small and a cold install is
          # cheaper than saving/restoring the cache tarball on every run.
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Matches the "packageManager" pin shared by every typescript/*/package.json workspace.
          version: 9
      # Workspace list is DISCOVERED, not hardcoded -- same reasoning as the `python` job's own
      # discovery loop above: a newly-added typescript/* workspace (its own package.json +
      # pnpm-workspace.yaml root, mirroring typescript/algenta-tools's layout) is picked up here
      # without touching this workflow.
      - name: Install + build + lint + test every TS workspace
        run: |
          set -euo pipefail
          found=0
          for ws in typescript/*/; do
            ws="${ws%/}"
            [ -f "$ws/package.json" ] || continue
            [ -f "$ws/pnpm-workspace.yaml" ] || continue
            found=$((found + 1))
            echo "::group::$ws"
            (cd "$ws" && pnpm install --frozen-lockfile && pnpm turbo run build lint test)
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No typescript/* workspaces discovered -- the discovery glob is wrong."
            exit 1
          fi
          echo "Ran $found TS workspace(s)."
      - name: Validate the shared tool-profile contract (stub today, see script header)
        run: npx --yes tsx@4 scripts/check-parity.ts
      # Tokenless upload -- see the Python job's Codecov step above for why no token is
      # needed and why fail_ci_if_error is false. The lcov reports come from
      # `vitest run --coverage` (v8 provider, thresholds in each package's
      # vitest.config.ts), which runs inside `pnpm turbo run test` above.
      - name: Upload TypeScript coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true  # GitHub OIDC instead of a Codecov token (the job grants id-token write)
          directory: typescript
          flags: typescript
          fail_ci_if_error: false

  # Lint gate. ruff.toml is the single configuration source for both this job and the
  # local pre-commit hook, and the ruff release installed here is pinned to the exact one
  # .pre-commit-config.yaml's ruff-pre-commit hook runs -- CI and a developer's laptop must
  # agree byte-for-byte on what is clean. Bump both together.
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff (same release as the pre-commit hook)
        # The release pin itself lives in .github/requirements/ruff.in (hash-pinned in ruff.txt);
        # it and .pre-commit-config.yaml's ruff-pre-commit rev move together.
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r .github/requirements/ruff.txt
      - name: ruff check
        run: ruff check --output-format github

  # contracts/integration-tool-contract.json's own JSON-syntax validity is
  # covered as a side effect of both check-parity.py and check-parity.ts
  # (both refuse to run on a malformed contract file) -- no separate job
  # needed for that alone.
