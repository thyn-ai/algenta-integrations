# Updates the draft release notes on every push to main and runs the autolabeler on
# PRs. pull_request_target is required for the autolabeler to label fork PRs; safe
# because release-drafter only reads PR metadata through the API -- this workflow
# deliberately has no checkout step, so no PR code ever executes.
name: release-drafter

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create/update the draft release
      pull-requests: write # autolabeler
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
