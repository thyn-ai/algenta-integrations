# Publish a released package to PyPI or npm, and attach the signed, attested artifacts to its
# GitHub Release.
#
# WHAT THIS FIXES. auto-release.yml versions, tags and creates GitHub Releases -- and stops there.
# Seven packages carried GitHub Releases (0.1.1 / 0.2.1) while every one of them 404'd on PyPI and
# npm, because no publish step existed anywhere in the repo. A GitHub Release is not a release: a
# user runs `pip install langchain-algenta`, not `gh release download`.
#
# TOKEN-BASED AUTH, matching the exact pattern thyn-ai/algenta-sdk's own release.yml already
# publishes with in production (PYPI_TOKEN via twine, NPM_TOKEN via npm's classic auth) -- not
# OIDC/Trusted Publishing. Trusted Publishing needs a one-time per-package registration on each
# registry's own web UI before anything can publish; plain API tokens need no such
# pre-registration and can create a brand-new project/package on first upload, which is exactly
# the situation every one of this repo's packages is in. Consistency with the proven, already-
# working sibling pipeline also means one less auth model to reason about across the org.
#
# THE BUILD-AND-VERIFY STEPS RUN UNCONDITIONALLY, even before publishing is switched on. A job that
# does nothing until someone flips a variable rots quietly; this way every release proves right now
# that its artifacts build, carry the right version, and pass the registry's own metadata check --
# so the first real publish is not also the first real test of this pipeline.
#
# TURNING IT ON is two owner actions, once ever, and then this is automatic forever:
#
#   1. Set repo secrets `PYPI_TOKEN` (a PyPI API token with scope to publish, account-scoped
#      tokens can create new projects on first upload -- project-scoped tokens cannot, since the
#      project doesn't exist yet) and `NPM_TOKEN` (an npm automation/publish token for an account
#      with rights to publish new, unscoped package names) on this repository -- or on the `pypi`
#      / `npm` GitHub Environments specifically, if narrower secret scoping is preferred.
#   2. Set the repository variable `PUBLISH_TO_REGISTRIES` to `true`.
#
# Until step 2, each publish job explains what is missing in the run summary and exits cleanly:
# reds on every release would train everyone to ignore a red release.
#
# scripts/resolve_release_target.py owns the tag -> package mapping and REFUSES a tag whose version
# no longer matches the package on that commit; this workflow only wires it up.
#
# RELEASE ASSETS, SIGNATURES AND PROVENANCE. A GitHub Release used to carry nothing but notes, and
# OpenSSF Scorecard's Signed-Releases check scored this repository "no releases found" for exactly
# that reason. Every Release this workflow handles now carries the bytes the registry received
# (wheel + sdist, or the npm tarball), one keyless Sigstore signature bundle per asset
# (`<asset>.sigstore.json`, signed by this workflow's own OIDC identity) and SLSA build provenance
# (`<package>-<version>.intoto.jsonl`, from the SLSA generic generator). The `sign` and
# `provenance` jobs are the ONLY ones granted `id-token: write` or `contents: write`; the registry
# jobs keep `contents: read` and hold nothing but their registry token. Both run on every build --
# dry runs and gated-off runs included -- so the signing path is exercised as often as the build
# path (see the paragraph above on jobs that rot quietly); only the Release upload sits behind the
# gate. How to verify a release is documented in CONTRIBUTING.md ("Releases"). Releases cut before
# this landed carry no assets and are not retro-signed.
#
# PYTHON FROM THE MARKETPLACE, NOT THE REPO. Every job below checks out the TAG being published
# as the build source of truth: `resolve_release_target.py`'s version check must run against
# what the tag actually contains, not against main (which may have moved on since -- replaying
# an old release must still build the OLD version, not spuriously fail because main bumped
# further). The interpreter therefore cannot come from a repo-local composite action: such an
# action would have to exist in every tag, and an earlier revision of this workflow did supply
# exactly that via a second checkout of the default ref. A SHA-pinned marketplace action
# resolves identically no matter which ref the workflow file itself came from, so the second
# checkout is gone.
#
# TWO TRANSITIONAL CONSEQUENCES, both one-time and manual. First:
# scripts/resolve_release_target.py first shipped on 2026-08-28, so a workflow_dispatch replay
# of any of the 7 tags cut before then (2026-08-24) fails at the resolve step -- the script is
# not in those trees. Second: tags cut between 2026-08-28 and the marketplace port above carry
# a workflow that still references the old repo-local action, which no longer exists on the
# default ref their second checkout fetched it from -- the same 404-on-the-action failure that
# was confirmed live back when the action was new, when manual verification runs against
# algenta-tools-v0.1.1 and pydantic-ai-algenta-v0.1.1 (tagged 2026-08-24, before the action
# existed) failed exactly that way. Neither failure is structural: every tag cut from here
# forward carries both the script and this marketplace-based workflow in its own tree, so real
# releases (the `release: published` trigger) are unaffected. Reconciling either class of old
# tag, if ever needed, is a manual, one-time action (build and upload that single package by
# hand) -- not something this workflow needs to grow a root-override mechanism for, which would
# mean reworking compute_release_bumps.py's REPO_ROOT model (shared with auto-release.yml) for
# an edge case that resolves itself.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. langchain-algenta-v0.1.1). Reconciles a release whose publish was skipped or failed."
        required: true
        type: string
      dry_run:
        description: "Rehearse without publishing: build, sign and attest the tag, but skip the registry and Release uploads. Everything lands in the run's workflow artifacts."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keyed on the tag, so releases of different packages publish in parallel while a re-run of the
  # same one cannot race itself into a duplicate-version error.
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.target.outputs.name }}
      version: ${{ steps.target.outputs.version }}
      registry: ${{ steps.target.outputs.registry }}
      directory: ${{ steps.target.outputs.directory }}
      publishing_enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the TAG, not the branch head: a release publishes the code that was tagged,
          # and main may have moved on since.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve the tag to a package
        id: target
        env:
          # Every `${{ }}` this file needs inside a shell script goes through `env:` and is read
          # back as "$VAR": the value reaches bash as data, never as script text, so a crafted
          # tag or output cannot inject commands (GitHub's script-injection hardening).
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 scripts/resolve_release_target.py \
            --tag "$RELEASE_TAG" \
            --github-output

      - name: Is publishing switched on
        id: gate
        env:
          # A dry run forces publishing off for this one run, whatever the variable says.
          ENABLED: ${{ vars.PUBLISH_TO_REGISTRIES == 'true' && inputs.dry_run != true }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - name: Explain the dry run
        if: inputs.dry_run == true
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### Dry run for \`$RELEASE_TAG\` -- nothing is published"
            echo
            echo "No registry upload and no Release upload. The build, its Sigstore bundles and"
            echo "its SLSA provenance are attached to this run as workflow artifacts"
            echo "(\`release-assets\`, \`release-signatures\`, and the generator's own)."
          } >> "$GITHUB_STEP_SUMMARY"

  pypi:
    name: PyPI
    needs: resolve
    if: needs.resolve.outputs.registry == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    outputs:
      # base64(sha256sum) of the release assets, consumed by `provenance`.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        # Same as ci.yml: uv is not preinstalled on GitHub-hosted runners, so it is
        # pip-installed per job, hash-pinned via .github/requirements/uv.txt. That file is read
        # from the checked-out TAG's tree, so a workflow_dispatch replay of a tag cut before it
        # existed fails here -- the same one-time, transitional class as the header's "TWO
        # TRANSITIONAL CONSEQUENCES"; every tag cut from here forward carries it.
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r .github/requirements/uv.txt

      - name: Build the distribution
        working-directory: ${{ needs.resolve.outputs.directory }}
        run: uv build --out-dir dist

      - name: Check the artifacts before offering them to a registry
        working-directory: ${{ needs.resolve.outputs.directory }}
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          uvx twine check --strict dist/*
          # The filename carries the version, so this catches a build that silently produced a
          # different one from the tag -- a bad sdist name is not recoverable once uploaded.
          version="$VERSION"
          ls dist/
          for artifact in dist/*; do
            case "$(basename "$artifact")" in
              *"$version"*) ;;
              *) echo "::error::$artifact does not carry version $version"; exit 1 ;;
            esac
          done

      # Subjects for the SLSA provenance: sha256sum of exactly the files the Release will carry,
      # by asset (base) name so the provenance subjects match the asset names, base64-encoded
      # as the generator expects. Recorded BEFORE the registry upload: the bytes are the same
      # either way, and a failed upload still leaves an inspectable build behind.
      - name: Record the release-asset digests (SLSA subjects)
        id: hash
        working-directory: ${{ needs.resolve.outputs.directory }}/dist
        run: |
          set -euo pipefail
          sha256sum -- * | tee "$RUNNER_TEMP/subjects.sha256sum"
          hashes=$(base64 -w0 "$RUNNER_TEMP/subjects.sha256sum")
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      # Handed to the `sign` job below, which signs and attaches these exact bytes without
      # rebuilding anything.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ needs.resolve.outputs.directory }}/dist/
          if-no-files-found: error

      - name: Explain the skip (publishing not switched on)
        if: needs.resolve.outputs.publishing_enabled != 'true' && inputs.dry_run != true
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          {
            echo "### PyPI publish skipped for \`$PACKAGE_NAME\` $VERSION"
            echo
            echo "The distribution built and passed \`twine check --strict\`, but publishing is off."
            echo
            echo "To switch it on (once ever, then permanently automatic):"
            echo "1. Set the \`PYPI_TOKEN\` secret on this repository (or on the \`pypi\` environment)."
            echo "2. Set the repository variable \`PUBLISH_TO_REGISTRIES\` to \`true\`."
            echo
            echo "Then re-run this workflow with tag \`$RELEASE_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        if: needs.resolve.outputs.publishing_enabled == 'true'
        working-directory: ${{ needs.resolve.outputs.directory }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: uvx twine upload --non-interactive --skip-existing --verbose dist/*

  npm:
    name: npm
    needs: resolve
    if: needs.resolve.outputs.registry == 'npm'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    outputs:
      # base64(sha256sum) of the release asset, consumed by `provenance`.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          # See ci.yml: no global npm cache, the install is small.
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Build the package
        # needs.resolve.outputs.directory is the nested package dir (typescript/<workspace>/
        # packages/<name>), but pnpm install/build must run at the WORKSPACE ROOT two levels up
        # (typescript/<workspace>) -- hardcoded to typescript/algenta-tools before this fix, which
        # silently skipped n8n-nodes-algenta's own install/build on every release, leaving its
        # devDependency-only `n8n-node` CLI missing and `npm publish`'s prerelease lifecycle hook
        # failing with "command not found" (exit 127). Confirmed live: PR run
        # https://github.com/thyn-ai/algenta-integrations/actions/runs/34162436762.
        env:
          PACKAGE_DIR: ${{ needs.resolve.outputs.directory }}
        run: |
          set -euo pipefail
          workspace_root="${PACKAGE_DIR%%/packages/*}"
          cd "$workspace_root"
          pnpm install --frozen-lockfile
          pnpm turbo run build

      - name: Pack the tarball and check it before offering it to a registry
        working-directory: ${{ needs.resolve.outputs.directory }}
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # A real pack, not --dry-run: this tarball is the Release asset AND the file `npm
          # publish` below uploads, so the registry, the Release, the signature and the
          # provenance all refer to one set of bytes -- no second pack whose output could drift.
          mkdir -p "$RUNNER_TEMP/release-assets"
          npm pack --pack-destination "$RUNNER_TEMP/release-assets"
          packed_version=$(node -p "require('./package.json').version")
          if [ "$packed_version" != "$VERSION" ]; then
            echo "::error::package.json is at $packed_version but the tag says $VERSION"
            exit 1
          fi

      # Same contract as the PyPI job's step of the same name: subjects for the SLSA provenance,
      # recorded before the registry upload.
      - name: Record the release-asset digests (SLSA subjects)
        id: hash
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          sha256sum -- * | tee "$RUNNER_TEMP/subjects.sha256sum"
          hashes=$(base64 -w0 "$RUNNER_TEMP/subjects.sha256sum")
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error

      - name: Explain the skip (publishing not switched on)
        if: needs.resolve.outputs.publishing_enabled != 'true' && inputs.dry_run != true
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          {
            echo "### npm publish skipped for \`$PACKAGE_NAME\` $VERSION"
            echo
            echo "The package built and packed cleanly, but publishing is off."
            echo
            echo "To switch it on (once ever, then permanently automatic):"
            echo "1. Set the \`NPM_TOKEN\` secret on this repository (or on the \`npm\` environment) --"
            echo "   an automation/publish token for an npm account with rights to publish new,"
            echo "   unscoped package names."
            echo "2. Set the repository variable \`PUBLISH_TO_REGISTRIES\` to \`true\`."
            echo
            echo "Then re-run this workflow with tag \`$RELEASE_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: needs.resolve.outputs.publishing_enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The TARBALL packed above, not the package directory: the registry receives the very
        # bytes the Release carries, the signature covers and the provenance attests. A
        # directory publish would pack a second time, and nothing but npm's own determinism
        # would tie that second tarball to the first.
        #
        # npm runs prepublishOnly / publish / postpublish only for directory publishes (its
        # lib/commands/publish.js: "only run scripts for directory type publishes"), so
        # n8n-nodes-algenta's `n8n-node prerelease` prepublishOnly hook does not run here. That
        # hook is @n8n/node-cli's guard against an accidental bare `npm publish` -- it exits 1
        # unless RELEASE_MODE is set and does nothing else (dist/commands/prerelease.js). The
        # resolve/version-check steps upstream are what make this a legitimate release, which is
        # exactly the property the guard exists to ensure. Verified locally on npm 11: a
        # tarball `publish --dry-run` succeeds without RELEASE_MODE and reports the same
        # integrity as `npm pack --json`, where a directory `publish --dry-run` runs the hook and
        # exits 1.
        run: |
          set -euo pipefail
          # Exactly one tarball, checked explicitly: an unmatched glob would hand npm the literal
          # pattern, and two matches would hand it two positional arguments, which `npm publish
          # <package-spec>` does not define. Neither can happen after the pack step above
          # succeeded, and this is what makes that a hard guarantee rather than an inference.
          tarballs=("$RUNNER_TEMP"/release-assets/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::expected exactly one packed tarball under $RUNNER_TEMP/release-assets, found: ${tarballs[*]}"
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public

  # The two jobs below run once the registry job for this tag has succeeded -- `pypi` or `npm`,
  # whichever the tag resolved to; the other is skipped, hence the explicit result check instead
  # of a bare `needs` (a bare `needs` on a skipped job skips the dependant too). They sign and
  # attest the bytes the registry received -- the `release-assets` artifact -- with nothing
  # rebuilt or checked out, and they are the only jobs in this file holding `id-token: write` or
  # `contents: write`.
  sign:
    name: Sign the release assets (Sigstore keyless)
    needs: [resolve, pypi, npm]
    if: ${{ !cancelled() && (needs.pypi.result == 'success' || needs.npm.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the assets and their .sigstore.json bundles to the Release
      id-token: write # Sigstore keyless signing with this job's OIDC identity
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: release-assets/*
          # Verify each bundle right after signing, against the identity the certificate must
          # carry: this workflow file at the run's ref -- the tag on a `release` event, the
          # dispatched branch on a workflow_dispatch. That is also the identity consumers verify
          # (CONTRIBUTING.md, "Verifying a release").
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          # The action's own Release upload fires on every `release` event, gate or no gate, and
          # never on a dispatch. The step below uploads instead: same gate as the registry
          # upload, both trigger paths.
          release-signing-artifacts: false

      # Kept as a workflow artifact on every run, so a dry run or a gated-off run still leaves
      # the bundles inspectable.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signatures
          path: release-assets/*.sigstore.json
          if-no-files-found: error

      - name: Attach the assets and their signatures to the GitHub Release
        if: needs.resolve.outputs.publishing_enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # No checkout in this job, so the repository is named explicitly. --clobber keeps a
        # replay of the same tag idempotent: the assets are replaced instead of the upload
        # failing on "asset already exists".
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  provenance:
    name: SLSA provenance (generic generator)
    needs: [resolve, pypi, npm]
    if: ${{ !cancelled() && (needs.pypi.result == 'success' || needs.npm.result == 'success') }}
    permissions:
      actions: read # the generator reads this run's workflow metadata
      id-token: write # keyless signing of the provenance
      contents: write # upload the .intoto.jsonl to the Release
    # Referenced by TAG -- deliberately the one exception to this repo's SHA-pinning. The
    # generator downloads its builder binary from the release named by the ref it was called
    # at, and slsa-verifier trusts the generator only at a `vX.Y.Z` tag (its README,
    # "Referencing SLSA builders and generators"; slsa-framework/slsa-verifier#12). A SHA here
    # fails the job or yields provenance no verifier accepts. thyn-ai/algenta-sdk's release.yml
    # and ossf/scorecard's own release do the same. v2.1.0 = f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      # Exactly one of the two registry jobs ran; a skipped job's outputs are empty.
      base64-subjects: ${{ needs.pypi.outputs.hashes || needs.npm.outputs.hashes }}
      # One self-describing file per Release instead of the generator's default
      # (`multiple.intoto.jsonl` for a wheel + sdist, `<tarball>.intoto.jsonl` for npm), so the
      # provenance of several packages can sit in one directory.
      provenance-name: ${{ needs.resolve.outputs.name }}-${{ needs.resolve.outputs.version }}.intoto.jsonl
      # Same gate as the registry and Release uploads above. On a `release` event the run sits
      # on the tag ref, on a dispatch it sits on a branch -- naming the tag explicitly covers both.
      upload-assets: ${{ needs.resolve.outputs.publishing_enabled == 'true' }}
      upload-tag-name: ${{ github.event.release.tag_name || inputs.tag }}
