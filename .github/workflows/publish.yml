# Publish a released package to PyPI or npm.
#
# WHAT THIS FIXES. auto-release.yml versions, tags and creates GitHub Releases -- and stops there.
# Seven packages carried GitHub Releases (0.1.1 / 0.2.1) while every one of them 404'd on PyPI and
# npm, because no publish step existed anywhere in the repo. A GitHub Release is not a release: a
# user runs `pip install langchain-algenta`, not `gh release download`.
#
# TOKEN-BASED AUTH, matching the exact pattern thyn-ai/algenta-sdk's own release.yml already
# publishes with in production (PYPI_TOKEN via twine, NPM_TOKEN via npm's classic auth) -- not
# OIDC/Trusted Publishing. Trusted Publishing needs a one-time per-package registration on each
# registry's own web UI before anything can publish; plain API tokens need no such
# pre-registration and can create a brand-new project/package on first upload, which is exactly
# the situation every one of this repo's packages is in. Consistency with the proven, already-
# working sibling pipeline also means one less auth model to reason about across the org.
#
# THE BUILD-AND-VERIFY STEPS RUN UNCONDITIONALLY, even before publishing is switched on. A job that
# does nothing until someone flips a variable rots quietly; this way every release proves right now
# that its artifacts build, carry the right version, and pass the registry's own metadata check --
# so the first real publish is not also the first real test of this pipeline.
#
# TURNING IT ON is two owner actions, once ever, and then this is automatic forever:
#
#   1. Set repo secrets `PYPI_TOKEN` (a PyPI API token with scope to publish, account-scoped
#      tokens can create new projects on first upload -- project-scoped tokens cannot, since the
#      project doesn't exist yet) and `NPM_TOKEN` (an npm automation/publish token for an account
#      with rights to publish new, unscoped package names) on this repository -- or on the `pypi`
#      / `npm` GitHub Environments specifically, if narrower secret scoping is preferred.
#   2. Set the repository variable `PUBLISH_TO_REGISTRIES` to `true`.
#
# Until step 2, each publish job explains what is missing in the run summary and exits cleanly:
# reds on every release would train everyone to ignore a red release.
#
# scripts/resolve_release_target.py owns the tag -> package mapping and REFUSES a tag whose version
# no longer matches the package on that commit; this workflow only wires it up.
#
# TWO CHECKOUTS PER JOB, ON PURPOSE. The tagged commit is checked out as the build source of
# truth: `resolve_release_target.py`'s version check must run against what the tag actually
# contains, not against main (which may have moved on since -- replaying an old release must
# still build the OLD version, not spuriously fail because main bumped further). But
# `.github/actions/fleet-python` was added to this repo on 2026-08-28, and every release tag
# that existed before then does not carry it -- `uses: ./.github/actions/fleet-python` resolves
# from whatever is checked out, so building an old tag with only that checkout 404s on the
# action itself. Confirmed live: both manual verification runs against algenta-tools-v0.1.1 and
# pydantic-ai-algenta-v0.1.1 (tagged 2026-08-24) failed exactly this way. A second checkout of
# the default ref, to a side path, supplies the action without moving the build off the tag.
#
# ONE MORE THING THE DUAL CHECKOUT CANNOT FIX: scripts/resolve_release_target.py itself is new in
# this same change, so it does not exist in ANY of the 7 tags cut before it (2026-08-24). A
# workflow_dispatch replay of one of those specific tags will fail at the resolve step -- there is
# no script there to run. This is transitional, not structural: every tag cut from here forward
# carries the script in its own tree, so real releases (the `release: published` trigger) are
# unaffected starting now. Reconciling one of the 7 pre-existing tags, if ever needed, is a manual,
# one-time action (build and upload that single package by hand) -- not something this workflow
# needs to grow a root-override mechanism for, which would mean reworking
# compute_release_bumps.py's REPO_ROOT model (shared with auto-release.yml) for an edge case that
# resolves itself.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. langchain-algenta-v0.1.1). Reconciles a release whose publish was skipped or failed."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keyed on the tag, so releases of different packages publish in parallel while a re-run of the
  # same one cannot race itself into a duplicate-version error.
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    outputs:
      name: ${{ steps.target.outputs.name }}
      version: ${{ steps.target.outputs.version }}
      registry: ${{ steps.target.outputs.registry }}
      directory: ${{ steps.target.outputs.directory }}
      publishing_enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the TAG, not the branch head: a release publishes the code that was tagged,
          # and main may have moved on since.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Check out the default ref too, only to supply .github/actions/fleet-python
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-tooling
          persist-credentials: false

      - name: Set up Python
        uses: ./.ci-tooling/.github/actions/fleet-python

      - name: Resolve the tag to a package
        id: target
        run: |
          python3 scripts/resolve_release_target.py \
            --tag "${{ github.event.release.tag_name || inputs.tag }}" \
            --github-output

      - name: Is publishing switched on
        id: gate
        run: echo "enabled=${{ vars.PUBLISH_TO_REGISTRIES == 'true' }}" >> "$GITHUB_OUTPUT"

  pypi:
    name: PyPI
    needs: resolve
    if: needs.resolve.outputs.registry == 'pypi'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Check out the default ref too, only to supply .github/actions/fleet-python
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-tooling
          persist-credentials: false

      - name: Set up Python
        uses: ./.ci-tooling/.github/actions/fleet-python

      - name: Install uv
        # Same as ci.yml: uv is not on the fleet image, it is pip-installed per job.
        run: python -m pip install --quiet --disable-pip-version-check uv

      - name: Build the distribution
        working-directory: ${{ needs.resolve.outputs.directory }}
        run: uv build --out-dir dist

      - name: Check the artifacts before offering them to a registry
        working-directory: ${{ needs.resolve.outputs.directory }}
        run: |
          set -euo pipefail
          uvx twine check --strict dist/*
          # The filename carries the version, so this catches a build that silently produced a
          # different one from the tag -- a bad sdist name is not recoverable once uploaded.
          version="${{ needs.resolve.outputs.version }}"
          ls dist/
          for artifact in dist/*; do
            case "$(basename "$artifact")" in
              *"$version"*) ;;
              *) echo "::error::$artifact does not carry version $version"; exit 1 ;;
            esac
          done

      - name: Explain the skip (publishing not switched on)
        if: needs.resolve.outputs.publishing_enabled != 'true'
        run: |
          {
            echo "### PyPI publish skipped for \`${{ needs.resolve.outputs.name }}\` ${{ needs.resolve.outputs.version }}"
            echo
            echo "The distribution built and passed \`twine check --strict\`, but publishing is off."
            echo
            echo "To switch it on (once ever, then permanently automatic):"
            echo "1. Set the \`PYPI_TOKEN\` secret on this repository (or on the \`pypi\` environment)."
            echo "2. Set the repository variable \`PUBLISH_TO_REGISTRIES\` to \`true\`."
            echo
            echo "Then re-run this workflow with tag \`${{ github.event.release.tag_name || inputs.tag }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        if: needs.resolve.outputs.publishing_enabled == 'true'
        working-directory: ${{ needs.resolve.outputs.directory }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: uvx twine upload --non-interactive --skip-existing dist/*

  npm:
    name: npm
    needs: resolve
    if: needs.resolve.outputs.registry == 'npm'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          # See ci.yml: on a persistent self-hosted runner setup-node's npm cache never resets
          # across jobs and grows unbounded.
          package-manager-cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Build the package
        # needs.resolve.outputs.directory is the nested package dir (typescript/<workspace>/
        # packages/<name>), but pnpm install/build must run at the WORKSPACE ROOT two levels up
        # (typescript/<workspace>) -- hardcoded to typescript/algenta-tools before this fix, which
        # silently skipped n8n-nodes-algenta's own install/build on every release, leaving its
        # devDependency-only `n8n-node` CLI missing and `npm publish`'s prerelease lifecycle hook
        # failing with "command not found" (exit 127). Confirmed live: PR run
        # https://github.com/thyn-ai/algenta-integrations/actions/runs/34162436762.
        run: |
          set -euo pipefail
          workspace_root="$(echo '${{ needs.resolve.outputs.directory }}' | sed 's#/packages/.*##')"
          cd "$workspace_root"
          pnpm install --frozen-lockfile
          pnpm turbo run build

      - name: Check the tarball before offering it to a registry
        working-directory: ${{ needs.resolve.outputs.directory }}
        run: |
          set -euo pipefail
          npm pack --dry-run
          packed_version=$(node -p "require('./package.json').version")
          if [ "$packed_version" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "::error::package.json is at $packed_version but the tag says ${{ needs.resolve.outputs.version }}"
            exit 1
          fi

      - name: Explain the skip (publishing not switched on)
        if: needs.resolve.outputs.publishing_enabled != 'true'
        run: |
          {
            echo "### npm publish skipped for \`${{ needs.resolve.outputs.name }}\` ${{ needs.resolve.outputs.version }}"
            echo
            echo "The package built and packed cleanly, but publishing is off."
            echo
            echo "To switch it on (once ever, then permanently automatic):"
            echo "1. Set the \`NPM_TOKEN\` secret on this repository (or on the \`npm\` environment) --"
            echo "   an automation/publish token for an npm account with rights to publish new,"
            echo "   unscoped package names."
            echo "2. Set the repository variable \`PUBLISH_TO_REGISTRIES\` to \`true\`."
            echo
            echo "Then re-run this workflow with tag \`${{ github.event.release.tag_name || inputs.tag }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: needs.resolve.outputs.publishing_enabled == 'true'
        working-directory: ${{ needs.resolve.outputs.directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
