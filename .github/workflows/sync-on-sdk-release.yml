# Keeps every package in this repository pinned to the latest published
# `algenta-sdk` (PyPI + npm). This is the RECEIVING side only. See the
# "SENDING SIDE (not implemented here)" section below for what
# thyn-ai/algenta-sdk still needs, as a separate, explicitly out-of-scope
# follow-up.
#
# TWO TRIGGERS, sharing one job, chosen deliberately:
#
#   1. `repository_dispatch` (type: "algenta-sdk-released") -- reacts
#      immediately once the sending side exists and fires it. Expected
#      payload: `{"tag": "sdk-v1.2.3", "version": "1.2.3"}` (matching the
#      `sdk-v*` tag format thyn-ai/algenta-sdk's own release.yml already
#      uses). `version` is read directly from the payload; `tag` is carried
#      through only for the PR title/body.
#
#   2. `schedule` (nightly) -- the lower-friction fallback. As of this
#      workflow's creation, thyn-ai/algenta-sdk's release.yml does not send
#      any repository_dispatch to anywhere -- there is no existing
#      precedent for it, and wiring the sending side is explicitly a
#      separate follow-up in a different repo with its own review process
#      (not done as part of this bootstrap). Without a second trigger, this
#      workflow would be full built but would never actually run until
#      someone else's future PR in a different repo lands. The nightly
#      schedule needs zero coordination with that repo, works starting
#      today, and self-heals if a future dispatch is ever missed or
#      delayed -- it just asks "what's actually published right now" via
#      scripts/latest-published-algenta-sdk-version.py. Bias here is
#      toward "simple and reliable" over "sophisticated," per the explicit
#      instruction this workflow was scoped under.
#
# Either path converges on the same steps: bump every package's algenta-sdk
# pin (scripts/bump-algenta-sdk-version.py), refresh lockfiles, run the full
# check suite, and open a PR if anything actually changed. NOTHING in this
# workflow auto-merges that PR -- see the note above the final job step.
#
# ── SENDING SIDE (not implemented here) ─────────────────────────────────
# For trigger #1 to ever fire, thyn-ai/algenta-sdk's own release.yml needs a
# new step, added in THAT repo (not this one), that POSTs a
# repository_dispatch to this repo after a successful publish:
#
#   curl -sS -X POST \
#     -H "Authorization: Bearer <token>" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/thyn-ai/algenta-integrations/dispatches \
#     -d '{"event_type":"algenta-sdk-released","client_payload":{"tag":"sdk-v1.2.3","version":"1.2.3"}}'
#
# The <token> should be a short-lived installation token for a GitHub App
# scoped to `contents: read` on thyn-ai/algenta-sdk (to run) and granted
# access to trigger dispatches on thyn-ai/algenta-integrations -- the same
# create-github-app-token pattern the Algenta engine's internal release
# pipeline already uses for its own cross-repo PR, not a long-lived PAT.
# That change belongs in thyn-ai/algenta-sdk's own PR review process and is
# intentionally not made here.
name: sync-on-sdk-release

on:
  repository_dispatch:
    types: [algenta-sdk-released]
  schedule:
    - cron: "13 3 * * *" # nightly
  workflow_dispatch: {} # manual trigger, e.g. to test this workflow itself

# The workflow-wide token is read-only; the single job below elevates itself to exactly the
# two writes it needs. Same permissions as before, scoped one level down: OpenSSF Scorecard's
# Token-Permissions check zeroes the score for a top-level write and only notes job-level ones.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits + pushes the sync/algenta-sdk-v* branch
      pull-requests: write # opens the version-bump PR via gh
    env:
      # Pin uv to the interpreter actions/setup-python just provisioned -- same reasoning
      # as ci.yml's python job (otherwise uv downloads its own floating "managed" CPython).
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # this job commits + pushes a branch within THIS repo

      # The version scripts below are stdlib-only -- a vanilla, pinned interpreter is
      # all they need.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Determine target algenta-sdk version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            VERSION="$DISPATCH_VERSION"
            SOURCE="repository_dispatch (${DISPATCH_TAG:-no tag in payload})"
          else
            VERSION="$(python scripts/latest-published-algenta-sdk-version.py)"
            SOURCE="scheduled check of PyPI + npm"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Target algenta-sdk version: $VERSION (via $SOURCE)"

      - name: Bump every package's algenta-sdk pin
        run: python scripts/bump-algenta-sdk-version.py --version "${{ steps.version.outputs.version }}"

      - name: Check whether anything actually changed
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already pinned to ${{ steps.version.outputs.version }} everywhere -- nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.diff.outputs.changed == 'true'
        # Hash-pinned via .github/requirements/uv.txt -- same file as ci.yml's python job.
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r .github/requirements/uv.txt

      - name: Refresh Python lockfile
        if: steps.diff.outputs.changed == 'true'
        working-directory: python
        run: uv lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: "20"
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.diff.outputs.changed == 'true'
        with:
          version: 9

      - name: Refresh TypeScript lockfile
        if: steps.diff.outputs.changed == 'true'
        working-directory: typescript/algenta-tools
        run: pnpm install --lockfile-only

      # ── Run the full check + conformance suite against the bumped pin ──
      - name: check-no-engine-dependency (+ its own regression tests)
        if: steps.diff.outputs.changed == 'true'
        run: |
          python scripts/check-no-engine-dependency.py --root .
          python scripts/test_check_no_engine_dependency.py

      - name: Python workspace -- install + parity stub + tests (none yet)
        if: steps.diff.outputs.changed == 'true'
        working-directory: python
        # --all-extras: pytest/pytest-asyncio/anyio only live under each package's `dev`
        # optional-dependencies extra. Without it `.venv/bin/pytest` never exists, so a future
        # `uv run pytest` here would silently fall back to whatever pytest happens to be on
        # PATH -- see ci.yml's "Run package tests" step for the real bug this caused there.
        run: |
          uv sync --all-packages --all-extras
          uv run python ../scripts/check-parity.py

      - name: TypeScript workspace -- install + build + lint + test + parity stub
        if: steps.diff.outputs.changed == 'true'
        working-directory: typescript/algenta-tools
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build lint test
          npx --yes tsx@4 ../../scripts/check-parity.ts

      # ── Open the PR. NOT auto-merged. ──────────────────────────────────
      # This org has an established "green CI -> admin-merge without
      # waiting for per-PR sign-off" convention for some repos, but that
      # was never confirmed for this brand-new, still-private, still
      # entirely-scaffolded repo. Leaving this as a normal PR for a human
      # (or a separate, explicitly-approved auto-merge rule added later)
      # rather than assuming the convention transfers here by default.
      # Defensive fallback: ubuntu-latest preinstalls gh, but a bare runner image would not.
      - name: Ensure the GitHub CLI is available
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh already on PATH: $(gh --version | head -1)"
            exit 0
          fi
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          # Pinned by hash, not just by version: the binary this installs runs with the job's
          # contents/pull-requests write token, so a tampered download must fail here. The digests are
          # the official ones from gh_${version}_checksums.txt on the cli/cli release; bump them with
          # the version (never trust a checksums file fetched at run time over the same channel).
          version="2.98.0"
          case "$arch" in
            x86_64)        arch="amd64"; expected_sha="3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de" ;;
            aarch64|arm64) arch="arm64"; expected_sha="cf689084f3a3618f7eae4a2420d335d74626d65f5e594b9828d125d69f800d86" ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          [ "$os" = "linux" ] || { echo "gh fallback is pinned for linux only (got $os)" >&2; exit 1; }
          dest="$RUNNER_TEMP/gh-cli"
          mkdir -p "$dest"
          tarball="$RUNNER_TEMP/gh_${version}_${os}_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_${os}_${arch}.tar.gz"
          echo "${expected_sha}  ${tarball}" | sha256sum -c --strict -
          tar -xz -C "$dest" --strip-components=1 -f "$tarball"
          rm -f "$tarball"
          echo "$dest/bin" >> "$GITHUB_PATH"

      - name: Open the version-bump PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE: ${{ steps.version.outputs.source }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="sync/algenta-sdk-v${VERSION}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(deps): bump algenta-sdk to ${VERSION}"
          git push origin "$BRANCH" --force
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR for $BRANCH already open -- push above updated it."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(deps): bump algenta-sdk to ${VERSION}" \
              --body "Automated bump of every package's \`algenta-sdk\` pin to \`${VERSION}\`, detected via ${SOURCE}. Full check + conformance suite ran green in this workflow before opening this PR. Does NOT auto-merge -- a human (or CODEOWNERS review) needs to merge this."
          fi
