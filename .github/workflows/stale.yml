# Marks inactive issues stale after 60 days and closes them 14 days later if still
# inactive. PRs go stale but are never auto-closed (days-before-pr-close: -1) --
# closing someone's contribution is a maintainer decision, not a bot's. Issues
# labeled pinned, security, or good first issue are exempt. The stale labels are
# created by the action on first run if missing.
name: stale

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          days-before-pr-close: -1
          exempt-issue-labels: "pinned,security,good first issue"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >-
            This issue has been inactive for 60 days and has been marked stale.
            It will be closed in 14 days if there is no further activity. Add a
            comment or the pinned label to keep it open.
          close-issue-message: >-
            This issue was closed after 14 days of inactivity following the stale
            marking. Comment or reopen if it is still relevant.
          stale-pr-message: >-
            This pull request has been inactive for 60 days and has been marked
            stale. It will not be closed automatically, but please update it or
            say so if it should stay open.
