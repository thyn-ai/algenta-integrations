# Authoritative security gate -- re-runs the pre-push policy on a clean checkout.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin). Change `overlay`/`mode` here.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      measure_baseline:
        description: "Measure security/baseline/*.txt on CI and upload as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    uses: thyn-ai/security-toolchain/.github/workflows/security-full.yml@e21eb4606016d4e422411127110658f6f3ba6cb8 # v0.1.1
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    with:
      overlay: pnpm-monorepo
      mode: advisory
      measure_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_baseline == true }}
