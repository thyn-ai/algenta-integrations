# OpenSSF Scorecard -- weekly supply-chain posture scan, published to api.scorecard.dev
# (which feeds the README badge and the scorecard.dev viewer it links to).
#
# Deliberately NOT uploaded to the Security tab. Scorecard's checks (BranchProtectionID,
# MaintainedID, CodeReviewID, ...) grade repository settings and process, with no file or
# line behind them; as code-scanning alerts they sat next to real CodeQL/Opengrep findings as
# noise nobody could act on from the code. The badge -> scorecard.dev viewer is where they
# are read, with per-check remediation text.
#
# Hardening rules this file follows (from ossf/scorecard-action's own requirements):
# no top-level `env`, and only the approved steps: checkout and scorecard-action.
# Results only publish on the default branch, so this runs on push to main plus a weekly
# cron -- no pull_request trigger, which keeps `id-token: write` away from fork-PR tokens
# entirely.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token used to sign the publish_results payload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          # Both inputs are required by the action; the file stays on the runner (see header).
          results_file: results.sarif
          results_format: sarif
          # Publishes scores to api.scorecard.dev -- the README badge reads from there.
          publish_results: true
