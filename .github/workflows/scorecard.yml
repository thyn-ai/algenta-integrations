# OpenSSF Scorecard -- weekly supply-chain posture scan, published to api.scorecard.dev
# (which feeds the README badge) and to the Security tab via SARIF.
#
# Hardening rules this file follows (from ossf/scorecard-action's own requirements):
# no top-level `env`, and only the approved steps: checkout, scorecard-action, and
# codeql-action/upload-sarif. Results only publish on the default branch, so this
# runs on push to main plus a weekly cron -- no pull_request trigger, which keeps
# `id-token: write` away from fork-PR tokens entirely.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # SARIF upload to code scanning
      id-token: write # OIDC token used to sign the publish_results payload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes scores to api.scorecard.dev -- the README badge reads from there.
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
