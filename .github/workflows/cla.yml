# Metadata-only CLA check, mirroring thyn-ai/algenta-sdk's cla.yml mechanism
# exactly (same action, same pattern, same reasoning) so a contributor who
# works across both repos signs the same agreement the same way. This
# workflow must NEVER check out the contributor's branch or run any
# contributor-controlled script — it only records/verifies a signature and
# comments on the PR. Do not add an `actions/checkout` step with
# `ref: ${{ github.event.pull_request.head.sha }}` to this file; that would
# execute fork-controlled refs in a context that has write access to PRs.
name: cla-check

on:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

permissions:
  # See thyn-ai/algenta-sdk's cla.yml for the full reasoning this is copied
  # from: contributor-assistant/github-action needs `contents` (to read PR
  # commits/committers and to create+maintain the `cla-signatures` branch)
  # and `pull-requests` + `statuses` (to comment/status the PR). Narrowing
  # this further makes the check fail outright rather than fail safe.
  #
  # What actually keeps this safe is NOT a narrow token -- it is that this
  # workflow never executes contributor-controlled code: no checkout step
  # (see the header), no fork script, and the one action is pinned to a
  # full commit SHA. The elevated token is therefore only ever held by that
  # pinned action, never by fork content.
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    # Org-wide self-hosted fleet (org variable RUNNER_LABELS); GitHub-hosted
    # runners are billing-blocked for this org.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/thyn-ai/algenta-integrations/blob/main/CLA.md
          branch: cla-signatures
          # dependabot's own PRs, and the automated algenta-sdk-version-bump
          # PR opened by sync-on-sdk-release.yml (authored as
          # github-actions[bot] via the default GITHUB_TOKEN -- see that
          # workflow's header comment for why it doesn't need a separate App
          # token), never need to sign a CLA. angelatgithub is the org/repo
          # owner authoring commits on Algenta's own behalf, not an external
          # contributor -- owner-authorized 2026-08-23.
          allowlist: dependabot[bot],github-actions[bot],angelatgithub
