name: Bug report
description: Something in a framework-integration package isn't working as expected.
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - pydantic-ai-algenta
        - langchain-algenta
        - litellm-algenta
        - algenta-tools (TypeScript)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. langchain-algenta 0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small code snippet that reproduces the issue.
      render: python
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, and anything else relevant.
    validations:
      required: false
