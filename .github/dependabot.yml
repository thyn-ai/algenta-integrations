# Dependabot configuration. `ignore` rules mark upgrades that are deliberate migrations, not bumps:
# mcp 2.x renames FastMCP (breaks tests/stub_server.py); fastmcp 4 requires mcp>=2; for the n8n node,
# typescript 7 breaks the @typescript-eslint peer range, @types/node must track engines>=18.10, and
# zod 3->4 is an incomplete migration (Codna review findings on #66/#68/#74, 2026-09-17).
version: 2
updates:
- package-ecosystem: pip
  directory: /python/pydantic-ai-algenta
  schedule:
    interval: daily
  allow:
  - dependency-name: algenta-sdk
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(pydantic-ai-algenta)
- package-ecosystem: pip
  directory: /python/langchain-algenta
  schedule:
    interval: daily
  allow:
  - dependency-name: algenta-sdk
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(langchain-algenta)
- package-ecosystem: pip
  directory: /python/litellm-algenta
  schedule:
    interval: daily
  allow:
  - dependency-name: algenta-sdk
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(litellm-algenta)
- package-ecosystem: pip
  directory: /python/haystack-algenta
  schedule:
    interval: weekly
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(haystack-algenta)
- package-ecosystem: pip
  directory: /python/llamaindex-algenta
  schedule:
    interval: weekly
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  - dependency-name: fastmcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(llamaindex-algenta)
- package-ecosystem: pip
  directory: /python/maf-algenta
  schedule:
    interval: weekly
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(maf-algenta)
- package-ecosystem: pip
  directory: /python/ray-serve-algenta
  schedule:
    interval: weekly
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(ray-serve-algenta)
- package-ecosystem: pip
  directory: /python/vllm-algenta
  schedule:
    interval: weekly
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(vllm-algenta)
- package-ecosystem: npm
  directory: /typescript/algenta-tools/packages/algenta-tools
  schedule:
    interval: daily
  allow:
  - dependency-name: algenta-sdk
  commit-message:
    prefix: chore(algenta-tools)
- package-ecosystem: npm
  directory: /typescript/algenta-tools
  schedule:
    interval: weekly
  ignore:
  - dependency-name: algenta-sdk
  commit-message:
    prefix: chore(deps)
- package-ecosystem: npm
  directory: /typescript/n8n-nodes-algenta
  schedule:
    interval: weekly
  commit-message:
    prefix: chore(deps)
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
  - dependency-name: zod
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  ignore:
  - dependency-name: thyn-ai/security-toolchain*
  groups:
    codeql-action:
      patterns:
      - github/codeql-action/*
  commit-message:
    prefix: chore(ci)
