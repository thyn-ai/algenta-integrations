# Dependabot configuration. `ignore` rules mark upgrades that are deliberate migrations, not bumps:
# each such rule names the blocked `versions` range as well as the update type, because a
# requirement-range widening (`<2.0.0` -> `<3.0.0`) is not a semver-major *bump* and slips past
# `update-types` alone (it did, in #115 and #116 on 2026-09-19).
# mcp 2.x renames FastMCP (breaks tests/stub_server.py); fastmcp 4 requires mcp>=2; for the n8n node,
# typescript 7 breaks the @typescript-eslint peer range, @types/node must track engines>=18.10, and
# zod 3->4 is an incomplete migration (review findings on #66/#68/#74, 2026-09-17).
#
# Every entry carries `cooldown: default-days: 7`: a version bump is proposed only once the release
# is a week old, so a compromised or hastily-yanked upload is caught upstream before it reaches a PR
# here (Dependabot's own default is 3 days). Security updates are never delayed by cooldown. The
# entries that exist only to track our own `algenta-sdk` (`allow: algenta-sdk`, daily) exclude it
# from the cooldown: those are our releases, and the point of the entry is to pick them up at once.
version: 2
updates:
- package-ecosystem: pip
  directory: /python/pydantic-ai-algenta
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    exclude:
    - algenta-sdk
  allow:
  - dependency-name: algenta-sdk
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  commit-message:
    prefix: chore(pydantic-ai-algenta)
- package-ecosystem: pip
  directory: /python/langchain-algenta
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    exclude:
    - algenta-sdk
  allow:
  - dependency-name: algenta-sdk
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  commit-message:
    prefix: chore(langchain-algenta)
- package-ecosystem: pip
  directory: /python/litellm-algenta
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    exclude:
    - algenta-sdk
  allow:
  - dependency-name: algenta-sdk
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  commit-message:
    prefix: chore(litellm-algenta)
- package-ecosystem: pip
  directory: /python/haystack-algenta
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  commit-message:
    prefix: chore(haystack-algenta)
- package-ecosystem: pip
  directory: /python/llamaindex-algenta
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  - dependency-name: fastmcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=4.0.0"
  - dependency-name: llama-index-tools-mcp
    # 0.5.0+ requires mcp>=2.0.0, unsolvable with this package's mcp<2.0.0 pin until the mcp 2 migration
    versions:
    - ">=0.5.0"
  commit-message:
    prefix: chore(llamaindex-algenta)
- package-ecosystem: pip
  directory: /python/maf-algenta
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  commit-message:
    prefix: chore(maf-algenta)
- package-ecosystem: pip
  directory: /python/ray-serve-algenta
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  commit-message:
    prefix: chore(ray-serve-algenta)
- package-ecosystem: pip
  directory: /python/vllm-algenta
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    deps:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcp
    update-types:
    - version-update:semver-major
    versions:
    - ">=2.0.0"
  commit-message:
    prefix: chore(vllm-algenta)
- package-ecosystem: uv
  # The workspace lock (python/uv.lock) is what CI installs; the per-package pip entries above never
  # touch it, so a transitive fix (nltk 3.10.4 for GHSA-8mgp-746c-j5xp, pulled in only by
  # llama-index-core) would otherwise wait for someone to run `uv lock` by hand. Security-only:
  # open-pull-requests-limit 0 disables version bumps while leaving security updates on.
  directory: /python
  schedule:
    interval: weekly
  cooldown: # inert here (version updates are off, and cooldown never delays security updates)
    default-days: 7
  open-pull-requests-limit: 0
  commit-message:
    prefix: chore(workspace)
- package-ecosystem: npm
  directory: /typescript/algenta-tools/packages/algenta-tools
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    exclude:
    - algenta-sdk
  allow:
  - dependency-name: algenta-sdk
  commit-message:
    prefix: chore(algenta-tools)
- package-ecosystem: npm
  directory: /typescript/algenta-tools
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: algenta-sdk
  commit-message:
    prefix: chore(deps)
- package-ecosystem: npm
  directory: /typescript/n8n-nodes-algenta
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: chore(deps)
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
  - dependency-name: zod
    update-types:
    - version-update:semver-major
- package-ecosystem: pip
  # The hash-pinned tool requirements (.in -> .txt via `uv pip compile --generate-hashes`) that the
  # workflows pip-install with --require-hashes. Weekly and grouped so a pin and its hashes are
  # refreshed in one PR. A ruff bump here must land together with .pre-commit-config.yaml's
  # ruff-pre-commit rev -- see .github/requirements/ruff.in.
  directory: /.github/requirements
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    ci-tools:
      patterns:
      - '*'
  commit-message:
    prefix: chore(ci)
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    codeql-action:
      patterns:
      - github/codeql-action/*
  commit-message:
    prefix: chore(ci)
